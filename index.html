<!DOCTYPE html>
<!-- esta pagina debe de ser simple pero bonita, como si la hubiera hecho el usuario aprendiendo lo basico -->
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos</title>
<style>
:root{color-scheme:light;--bg1:#ffa8de;--bg2:#9c6a92;--card:rgba(255,255,255,.22);--cell:rgba(255,255,255,.3);--txt:#fff;--pink:#ff69b4;--purple:#5b21c6;--green:#22c55e;--red:#c62828;--modal:#fff5fb;--mt:#8a5a7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--txt)}
body{background:radial-gradient(ellipse at center,var(--bg1) 55%,var(--bg2) 100%);touch-action:none}
.screen{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:14px}
.screen.on{display:flex}
h1{margin:0;font-size:36px}
.sub{opacity:.85;font-size:15px;margin:0}
.btn{border:0;border-radius:12px;padding:13px 26px;font:bold 17px Arial,sans-serif;color:#fff;cursor:pointer;background:var(--purple)}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.p{background:var(--pink)}
.btn.s{padding:9px 14px;font-size:15px;border-radius:10px}
.game{background:var(--card);border-radius:20px;padding:14px 24px;text-align:center;width:min(300px,88vw)}
.game b{display:block;font-size:24px;margin-bottom:8px}
.top{width:min(440px,96vw);display:flex;justify-content:space-between;align-items:center}
.stat{background:var(--card);border-radius:14px;padding:8px 18px;text-align:center}
.stat small{display:block;font-size:12px;opacity:.85}.stat span{font-size:26px;font-weight:bold}
.bar{width:min(440px,96vw);height:12px;border-radius:8px;background:var(--cell);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:8px;transition:width .3s}
#board{--s:min(11.2vw,48px);display:grid;grid-template-columns:repeat(8,var(--s));grid-template-rows:repeat(8,var(--s));gap:2px;background:var(--card);padding:6px;border-radius:16px}
.c{border-radius:6px;background:var(--cell);transition:background .1s}
.c.f{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.c.gh{opacity:.55;outline:2px dashed #fff;outline-offset:-3px}
.c.bad{background:rgba(198,40,40,.5)}
.c.boom{animation:boom .3s}
@keyframes boom{50%{transform:scale(1.2);background:#fff}}
#tray{width:min(440px,96vw);height:130px;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-radius:16px}
.slot{width:30%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
.pc{display:grid;gap:2px;pointer-events:none}
.pc div{border-radius:5px}
#drag{position:fixed;z-index:50;opacity:.8;pointer-events:none;display:none;gap:2px;grid-auto-flow:row}
#drag div{border-radius:6px}
#drag div.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}
.ov.on{display:flex}
.modal{background:var(--modal);color:var(--mt);border-radius:20px;padding:24px;width:min(320px,88vw);text-align:center;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;color:var(--pink);font-size:28px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.tg{width:56px;height:30px;border-radius:15px;border:0;background:#ccc;position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}.tg.on::after{left:29px}
.login{background:#fff;color:#000;border-radius:28px;padding:34px 38px;width:min(400px,90vw);display:flex;flex-direction:column;gap:14px}
.login h1{color:#000;font-size:34px;text-align:center}
.login input{border:0;background:#fff5fb;border-radius:16px;padding:15px 16px;font-size:17px;outline:none;color:#333;width:100%;user-select:text;-webkit-user-select:text}
.login .btn{background:var(--pink);border-radius:16px;font-size:15px;padding:14px;width:100%}
#lmsg{color:var(--red);font-size:14px;text-align:center;min-height:18px;margin:0}
.login .skip{background:none;color:#999;font-size:14px;padding:4px;text-decoration:underline}
#menu{position:relative}
#acct{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:8px;align-items:center}
#acct span{font-weight:bold;font-size:15px}
input{user-select:text;-webkit-user-select:text}
#pf{justify-content:flex-start}
.tabs{display:flex;gap:8px}
.tabs .btn{background:var(--cell)}.tabs .btn.on{background:var(--pink)}
.pbox{width:min(440px,96vw);flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pbox h3{margin:0;font-size:16px}
.pbox input[type=text]{border:0;border-radius:12px;padding:12px;font-size:16px;background:#fff5fb;color:#333;outline:none;width:100%}
.av{border-radius:50%;background:#8b5cf6;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.item{display:flex;align-items:center;gap:10px;background:var(--cell);border-radius:14px;padding:8px 10px}
.item .inf{flex:1;min-width:0}
.item .inf b{display:block}
.item .inf small{opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .btn{padding:7px 10px;font-size:13px}
.sw{display:flex;gap:10px;justify-content:center}
.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw i.on{border-color:#fff}
.bdg{background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-style:normal;margin-left:4px}
.msg{font-size:14px;min-height:18px;margin:0;text-align:center}
#tw{gap:8px}
.tray2{width:min(440px,96vw);height:110px;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-radius:16px}
#twC{display:block}
#twG{position:relative;width:min(440px,96vw);height:10px;border-radius:6px;background:linear-gradient(90deg,#ef4444,#f59e0b 22%,#22c55e 42%,#22c55e 58%,#f59e0b 78%,#ef4444)}
#twG i{position:absolute;top:-4px;left:50%;width:6px;height:18px;border-radius:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 3px rgba(0,0,0,.5)}
#twG i#twP{background:transparent;border:2px solid #fff;display:none}
#twT .wait{font-size:18px;font-weight:bold;opacity:.9}
#invList{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;touch-action:pan-y;text-align:left}
#invList .item{background:#f6e3ef}
#invList .msg{color:var(--mt)}
#twDrag{position:fixed;z-index:50;opacity:.85;pointer-events:none;display:none;gap:2px}
#twDrag div{border-radius:5px}
#twDrag div.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
</style></head><body>

<div class="screen on" id="menu">
  <div id="acct"></div>
  <h1>Juegos</h1>
  <p class="sub">Elige un juego para empezar</p>
  <div class="game"><b>Block Blast</b><button class="btn" id="play">Jugar</button><p class="sub" id="best" style="margin-top:10px"></p></div>
  <div class="game"><b>Torre Tetris</b>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn s" id="tw1">Contra IA</button>
      <button class="btn s" id="tw2">Con un amigo</button>
    </div>
    <p class="sub" id="twBest" style="margin-top:8px"></p>
  </div>
  <button class="btn p s" onclick="openSet()">Ajustes</button>
  <button class="btn p s" id="goPf" style="display:none">Perfil y amigos <i class="bdg" id="bdgM" style="display:none"></i></button>
</div>

<div class="screen" id="gs">
  <div class="top">
    <button class="btn r s" id="back">Menú</button>
    <div class="stat"><small>Récord</small><span id="lv">0</span></div>
    <div class="stat"><small>Puntos</small><span id="pt">0</span></div>
    <button class="btn p s" onclick="openSet()">Ajustes</button>
  </div>
  <div id="board"></div>
  <div id="tray"></div>
</div>
<div class="screen" id="pf">
  <div class="top">
    <button class="btn r s" id="pfBack">Menú</button>
    <b style="font-size:20px">Mi cuenta</b>
    <span style="width:70px"></span>
  </div>
  <div class="tabs">
    <button class="btn s on" id="tabP">Perfil</button>
    <button class="btn s" id="tabF">Amigos <i class="bdg" id="bdg" style="display:none"></i></button>
  </div>

  <div class="pbox" id="pP">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div class="av" id="pAv" style="width:96px;height:96px;font-size:40px"></div>
      <b id="pName" style="font-size:22px"></b>
      <small id="pBest"></small>
      <div style="display:flex;gap:8px">
        <button class="btn p s" id="pPhoto">Cambiar foto</button>
        <button class="btn s" id="pNoPhoto">Quitar</button>
      </div>
      <input type="file" id="pFile" accept="image/*" hidden>
    </div>
    <h3>Estado</h3>
    <input type="text" id="pStatus" maxlength="40" placeholder="Escribe algo sobre ti...">
    <h3>Color del avatar</h3>
    <div class="sw" id="pSw"></div>
    <button class="btn g" id="pSave">Guardar</button>
    <p class="msg" id="pMsg"></p>
  </div>

  <div class="pbox" id="pF" style="display:none">
    <h3>Agregar amigo</h3>
    <div style="display:flex;gap:8px">
      <input type="text" id="fIn" placeholder="Nombre de usuario" maxlength="16">
      <button class="btn g s" id="fAdd">Agregar</button>
    </div>
    <p class="msg" id="fMsg"></p>
    <div id="fReq"></div>
    <div id="fSent"></div>
    <div id="fList"></div>
  </div>
</div>
<div id="drag"></div>

<div class="screen" id="tw">
  <div class="top">
    <button class="btn r s" id="twBack">Menú</button>
    <b id="twInfo" style="font-size:18px"></b>
    <span style="width:70px"></span>
  </div>
  <div id="twG"><i id="twM"></i><i id="twP"></i></div>
  <canvas id="twC"></canvas>
  <div class="tray2" id="twT"></div>
  <p class="sub" style="margin:0;font-size:13px">Arrástrala a la torre (se gira sola para encajar) · debe apoyarse en la base u otra pieza</p>
</div>
<div id="twDrag"></div>

<div class="ov" id="inv"><div class="modal">
  <h2 id="invT">Invitar amigo</h2>
  <div id="invList"></div>
  <p class="msg" id="invMsg" style="color:var(--mt)"></p>
  <button class="btn r" id="invX">Cancelar</button>
</div></div>
<div class="ov" id="got"><div class="modal">
  <h2>¡Te invitan!</h2>
  <p id="gotM" style="margin:0"></p>
  <button class="btn g" id="gotY">Aceptar</button>
  <button class="btn r" id="gotN">Rechazar</button>
</div></div>

<div class="ov" id="lg"><div class="login">
  <h1 id="lt">Login</h1>
  <input id="lu" placeholder="Usuario o correo" autocomplete="username">
  <input id="lm" type="email" placeholder="Correo" autocomplete="email" style="display:none">
  <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password">
  <p id="lmsg"></p>
  <button class="btn" id="bmain">Iniciar Sesión</button>
  <button class="btn" id="bsec">Registrarse</button>
  <button class="btn skip" id="bskip">Seguir sin cuenta</button>
</div></div>

<div class="ov" id="set"><div class="modal"><h2>Ajustes</h2>
  <div class="row">Sonido <button class="tg" id="tS"></button></div>
  <div class="row">Vibración <button class="tg" id="tV"></button></div>
  <button class="btn" onclick="closeSet()">Listo</button></div></div>
<div class="ov" id="end"><div class="modal"><h2 id="et"></h2><p id="em" style="margin:0"></p><button class="btn g" id="eb"></button><button class="btn r" id="eh">Menú</button></div></div>

<script>
const $=id=>document.getElementById(id);
let cfg={snd:true,vib:true},best=0;
try{Object.assign(cfg,JSON.parse(localStorage.getItem('bb_cfg')||'{}'));best=+localStorage.getItem('bb_best2')||0}catch(e){}
const save=()=>{try{localStorage.setItem('bb_cfg',JSON.stringify(cfg))}catch(e){}};
function tgs(){$('tS').classList.toggle('on',cfg.snd);$('tV').classList.toggle('on',cfg.vib)}
$('tS').onclick=()=>{cfg.snd=!cfg.snd;save();tgs();beep(600,.1)};
$('tV').onclick=()=>{cfg.vib=!cfg.vib;save();tgs();vib(40)};
function openSet(){tgs();$('set').classList.add('on')}
function closeSet(){$('set').classList.remove('on')}
$('best').textContent='Récord: '+best;

let AC;
function beep(f,d,t='sine',v=.15,delay=0){
  if(!cfg.snd)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+delay;
  o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}
}
const vib=p=>{if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

const SH=[["#"],["##"],["###"],["####"],["#####"],["#","#"],["#","#","#"],["#","#","#","#"],["#","#","#","#","#"],["##","##"],["###","###","###"],["###","##."],["#.","##"],["##","#."],["##",".#"],[".#","##"],["###","#..","#.."],["###","..#","..#"],["..#","..#","###"],["#..","#..","###"],["###",".#."],["#.","##","#."]];
const COL=["#ff4fa3","#8b5cf6","#22c55e","#f59e0b","#38bdf8","#ef4444","#14b8a6"];
const N=8;
let G,P,score,lvScore,lv,cells=[],busy=false;
const target=l=>80+l*40;

const board=$('board');
for(let i=0;i<64;i++){const d=document.createElement('div');d.className='c';board.appendChild(d);cells.push(d)}

function newPiece(){const i=Math.random()*SH.length|0;const w=Math.max(...SH[i].map(r=>r.length));return{m:SH[i].map(r=>[...r.padEnd(w,'.')].map(c=>c==='#')),c:COL[Math.random()*COL.length|0]}}
function newPieces(){P=[newPiece(),newPiece(),newPiece()];drawTray()}
function startLevel(l){
  lv=l;lvScore=0;G=Array(64).fill(0);
  let k=0;
  while(k>0){const i=Math.random()*64|0;if(!G[i]){G[i]=COL[Math.random()*COL.length|0];k--}}
  newPieces();render();hud();
}
function startGame(){score=0;startLevel(1)}
function hud(){if(score>best){best=score;try{localStorage.setItem('bb_best2',best)}catch(e){}if(window.FB)FB.saveBest(best)}$('lv').textContent=best;$('pt').textContent=score;$('best').textContent='Récord: '+best}
function render(){cells.forEach((d,i)=>{d.className='c'+(G[i]?' f':'');d.style.background=G[i]||''})}
function drawTray(){
  const t=$('tray');t.innerHTML='';
  P.forEach((p,i)=>{
    const s=document.createElement('div');s.className='slot';
    if(p){const g=document.createElement('div');g.className='pc';const w=p.m[0].length,sz=Math.min(26,Math.floor(80/Math.max(w,p.m.length)));
      g.style.gridTemplateColumns=`repeat(${w},${sz}px)`;
      p.m.forEach(r=>r.forEach(c=>{const d=document.createElement('div');d.style.height=sz+'px';if(c){d.style.background=p.c;d.style.boxShadow='inset 0 -3px 0 rgba(0,0,0,.15)'}g.appendChild(d)}));
      s.appendChild(g);s.addEventListener('pointerdown',e=>dragStart(e,i))}
    t.appendChild(s)});
}
const fits=(p,r,c)=>{if(r<0||c<0||r+p.m.length>N||c+p.m[0].length>N)return false;
  return p.m.every((row,y)=>row.every((v,x)=>!v||!G[(r+y)*N+c+x]))};
const anyFit=p=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(p,r,c))return true;return false};

let dg=null;
function dragStart(e,i){
  if(busy||!P[i])return;e.preventDefault();
  const p=P[i],el=$('drag'),s=cells[1].getBoundingClientRect().left-cells[0].getBoundingClientRect().left;
  el.innerHTML='';el.style.display='grid';el.style.gridTemplateColumns=`repeat(${p.m[0].length},${s-2}px)`;
  p.m.forEach(r=>r.forEach(c=>{const d=document.createElement('div');d.style.height=s-2+'px';if(c){d.style.background=p.c;d.className='on'}el.appendChild(d)}));
  dg={i,p,s,lift:e.pointerType==='mouse'?0:s*1.6,r:-1,c:-1};
  beep(500,.05,'sine',.08);vib(8);dragMove(e);
  window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',dragEnd);window.addEventListener('pointercancel',dragEnd);
}
const clearGhost=()=>cells.forEach((d,i)=>{d.classList.remove('gh');d.style.background=G[i]||''});
function dragMove(e){
  if(!dg)return;const{p,s,lift}=dg,w=p.m[0].length*s,h=p.m.length*s;
  const L=e.clientX-w/2,T=e.clientY-h/2-lift,el=$('drag');
  el.style.left=L+'px';el.style.top=T+'px';
  const b=cells[0].getBoundingClientRect();
  dg.c=Math.round((L-b.left)/s);dg.r=Math.round((T-b.top)/s);
  clearGhost();
  if(fits(p,dg.r,dg.c))p.m.forEach((row,y)=>row.forEach((v,x)=>{if(!v)return;const k=(dg.r+y)*N+dg.c+x;
    cells[k].classList.add('gh');cells[k].style.background=p.c}));
}
function dragEnd(){
  window.removeEventListener('pointermove',dragMove);window.removeEventListener('pointerup',dragEnd);window.removeEventListener('pointercancel',dragEnd);
  $('drag').style.display='none';clearGhost();
  if(!dg)return;const{p,i,r,c}=dg;dg=null;
  if(fits(p,r,c))place(p,i,r,c);else{beep(180,.15,'triangle',.1);vib(25)}
}
function place(p,i,r,c){
  let n=0;
  p.m.forEach((row,y)=>row.forEach((v,x)=>{if(v){G[(r+y)*N+c+x]=p.c;n++}}));
  P[i]=null;let pts=n;
  const clr=new Set();let lines=0;
  for(let a=0;a<N;a++){
    if([...Array(N)].every((_,b)=>G[a*N+b])){lines++;for(let b=0;b<N;b++)clr.add(a*N+b)}
    if([...Array(N)].every((_,b)=>G[b*N+a])){lines++;for(let b=0;b<N;b++)clr.add(b*N+a)}
  }
  render();
  if(lines){
    pts+=lines*10*lines;busy=true;
    clr.forEach(k=>cells[k].classList.add('boom'));
    for(let k=0;k<Math.min(lines+2,6);k++)beep(520*Math.pow(1.122,k*2),.18,'triangle',.14,k*.07);
    vib([20,30,40]);
    setTimeout(()=>{clr.forEach(k=>G[k]=0);render();busy=false;after(pts)},280);
  }else{beep(420,.08,'sine',.15);beep(630,.08,'sine',.1,.04);vib(12);after(pts)}
}
function after(pts){
  score+=pts;lvScore+=pts;hud();
  if(!P.some(x=>x))newPieces();else drawTray();
  if(!P.filter(x=>x).some(anyFit)){
    [400,330,260,190].forEach((f,k)=>beep(f,.25,'sawtooth',.08,k*.15));vib([60,40,100]);
    show('Sin espacio','Hiciste '+score+' puntos','Revivir por un beso de novio 😘',revive,'Cancelar',()=>{hide();startGame()})}
}
function show(t,m,b,fn,b2,fn2){$('et').textContent=t;$('em').textContent=m;$('eb').textContent=b;$('eb').onclick=fn;$('eh').textContent=b2||'Menú';$('eh').onclick=fn2||menu;$('end').classList.add('on')}
function revive(){
  hide();
  [...Array(N)].map((_,r)=>[r,G.slice(r*N,r*N+N).filter(Boolean).length]).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([r])=>{for(let c=0;c<N;c++)G[r*N+c]=0});
  let t=0;do{newPieces();t++}while(t<30&&!P.some(anyFit));
  render();[523,659,784].forEach((f,k)=>beep(f,.25,'triangle',.15,k*.1));vib([30,40,60]);
}
function hide(){$('end').classList.remove('on')}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function menu(){hide();go('menu')}
$('play').onclick=()=>{go('gs');startGame();beep(600,.1)};
$('back').onclick=menu;$('eh').onclick=menu;

/* ---------- cuenta (el codigo de Firebase esta en el script de abajo) ---------- */
const lmsg=t=>{$('lmsg').textContent=t};
let lmode='login';
function setMode(m){
  lmode=m;lmsg('');
  const t={
    login:['Login','Usuario o correo','Iniciar Sesión','Registrarse','Seguir sin cuenta'],
    reg:['Crear cuenta','Nombre de usuario','Crear cuenta','Ya tengo cuenta','Cancelar'],
    claim:['Tu usuario','Elige tu nombre de usuario','Guardar','','Más tarde']
  }[m];

  $('bsec').textContent=t[3];$('bsec').style.display=t[3]?'':'none';$('bskip').textContent=t[4];

const mkBtn=(txt,cls,fn)=>{const b=document.createElement('button');b.className='btn s '+cls;b.textContent=txt;b.onclick=fn;return b};

  }

// junta el récord de este dispositivo con el de la cuenta
window.mergeBest=r=>{
  r=+r||0;
  if(r>best){best=r;try{localStorage.setItem('bb_best2',best)}catch(e){};$('lv').textContent=best;$('best').textContent='Récord: '+best}
  else if(best>r&&window.FB)FB.saveBest(best);

// por si Firebase tarda o no hay internet, igual aparece el boton
setTimeout(()=>{if(!$('acct').firstChild)setAcct('out')},4000);
document.addEventListener('touchmove',e=>{if(!e.target.closest('.pbox,#invList'))e.preventDefault()},{passive:false});

<script>
/* ---------- Torre Tetris: equilibrar piezas en un balancín ---------- */
(function(){
const C=19,R=13,S=26;              // columnas, filas, tamaño de casilla
const CW=520,CH=440,OX=260,OY=270;  // lienzo y centro del balancín
const RR=130;                       // radio del arco del balancín
const BL=6,BR=12;                    // columnas donde está la base
const LIM=4.0,DEG=4.5;              // se cae si el centro de masa se corre más de 4 casillas; 4.5° por casilla
const BH=(BR-BL+1)*S/2,YB=Math.round(Math.sqrt(RR*RR-BH*BH));
const LIMA=LIM*DEG*Math.PI/180;

const TETRO={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const TCOL={I:'#38bdf8',O:'#f5d90a',T:'#a855f7',S:'#22c55e',Z:'#ef4444',J:'#3b5bdb',L:'#f59e0b'};
const KEYS=Object.keys(TETRO);
const rotM=m=>{const h=m.length,w=m[0].length,o=[];for(let c=0;c<w;c++){o.push([]);for(let r=h-1;r>=0;r--)o[c].push(m[r][c])}return o};
const cellsOf=m=>{const a=[];m.forEach((row,r)=>row.forEach((v,c)=>{if(v)a.push([r,c])}));return a};
const newP=rnd=>{const k=KEYS[(rnd||Math.random)()*KEYS.length|0];const b=TETRO[k].map(r=>r.slice());return{m:b.map(r=>r.slice()),b:b,c:TCOL[k],rot:0}};
const rotN=(m,n)=>{for(let i=0;i<(n&3);i++)m=rotM(m);return m};
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

const cv=$('twC'),ctx=cv.getContext('2d');
cv.width=CW;cv.height=CH;

let mode=1,turn=0,names=['Tú','IA 🤖'],G2=[],placed=0,tray=[];          // mode 1 = contra la IA, 2 = con un amigo (en línea)
let seed=1,meIdx=0,online=null,mv=0,seen=0,queue=[],ghost=null,thinking=false,unwatch=null;
let ang=0,av=0,tgt=0,falling=0,over=false,drag=null,raf=0,trayTop=0;
let rv=0,thud=false,gid=0,sndCool=0;
let rm=null,oppGone=false;            // cuadro final en línea: {opp,base,offer,gone,wait,note}   // velocidad del balancín, golpe, id de partida, pausa de sonido
let pieces=[],bodies=[];            // piezas puestas y piezas cayendo (gravedad)
let wins=0;try{wins=+localStorage.getItem('bt_wins')||0}catch(e){}
const showBest=()=>{$('twBest').textContent='Victorias contra la IA: '+wins};
showBest();

const cx=c=>(c-C/2)*S;
const cy=r=>YB-(R-r)*S;

/* ¿cabe la pieza m con su esquina de arriba a la izquierda en (row,col)?
   Las casillas tienen que estar libres y la pieza debe estar APOYADA: alguna de sus casillas tiene justo debajo
   otra pieza o la base. Se puede meter en cualquier hueco (incluso debajo de otra pieza) mientras se apoye.
   La última fila es solo la base. */
function canPut(m,row,col){
  const h=m.length,w=m[0].length;
  if(col<0||col+w>C||row<0||row+h>R-1)return false;
  let sup=false;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    if(!m[r][c])continue;
    const y=row+r,x=col+c;
    if(G2[y][x])return false;
    if(G2[y+1][x])sup=true;
  }
  return sup;
}
const cellsAt=(m,row,col)=>cellsOf(m).map(([dr,dc])=>[row+dr,col+dc]);
/* comprobación rápida: ¿el centro de la pieza sola queda sobre sus apoyos? */
function localOk(m,row,col){
  let lo=1e9,hi=-1e9,sx=0,n=0;
  cellsOf(m).forEach(([dr,dc])=>{
    const y=row+dr,x=col+dc;sx+=x+.5;n++;
    if(G2[y+1][x]){if(x<lo)lo=x;if(x+1>hi)hi=x+1}
  });
  const com=sx/n;
  return com>=lo-1e-9&&com<=hi+1e-9;
}
/* gravedad: para cada pieza se toma ella y todo lo que descansa sobre ella (directa o indirectamente).
   Ese bloque se sostiene si su centro de masa queda entre el apoyo más a la izquierda y el más a la derecha
   (apoyos = casillas del bloque con algo debajo que no sea del bloque). Devuelve null si todo aguanta,
   o {dir:-1|1} hacia donde se cae. */
function unstable(ps){
  const n=ps.length,id=[...Array(R)].map(()=>Array(C).fill(-1));
  ps.forEach((p,k)=>p.cells.forEach(([r,c])=>{id[r][c]=k}));
  const up=ps.map(()=>[]);
  ps.forEach((p,k)=>{
    const seen={};
    p.cells.forEach(([r,c])=>{
      const j=r+1<R?id[r+1][c]:-1;
      if(j>=0&&j!==k&&!seen[j]){seen[j]=1;up[j].push(k)}
    });
  });
  for(let k=0;k<n;k++){
    const inU=new Uint8Array(n),st=[k],U=[];inU[k]=1;
    while(st.length){const a=st.pop();U.push(a);up[a].forEach(b=>{if(!inU[b]){inU[b]=1;st.push(b)}})}
    let lo=1e9,hi=-1e9,sx=0,cnt=0;
    U.forEach(a=>ps[a].cells.forEach(([r,c])=>{
      sx+=c+.5;cnt++;
      const j=r+1<R?id[r+1][c]:-1;
      const onBase=r+1===R-1&&c>=BL&&c<=BR;
      if(onBase||(j>=0&&!inU[j])){if(c<lo)lo=c;if(c+1>hi)hi=c+1}
    }));
    if(lo>hi)return{dir:0};
    const com=sx/cnt;
    if(com<lo-1e-9)return{dir:-1};
    if(com>hi+1e-9)return{dir:1};
  }
  return null;
}
/* cuántos lados de la pieza quedan pegados a la torre (más lados = encaja mejor) */
function contacts(m,row,col){
  const h=m.length,w=m[0].length;let n=0;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    if(!m[r][c])continue;
    for(const [dy,dx] of D4){
      const rr=r+dy,cc=c+dx;
      if(rr>=0&&rr<h&&cc>=0&&cc<w&&m[rr][cc])continue;     // es otra casilla de la misma pieza
      const y=row+rr,x=col+cc;
      if(x>=0&&x<C&&y>=0&&y<R&&G2[y][x])n++;
    }
  }
  return n;
}
/* las rotaciones distintas de una pieza (sin repetir las que se ven igual) */
function rots(p){
  const o=[],seen={};let m=p.b;
  for(let k=0;k<4;k++){const key=JSON.stringify(m);if(!seen[key]){seen[key]=1;o.push({rot:k,m:m})}m=rotM(m)}
  return o;
}
function spots(m){
  const h=m.length,w=m[0].length,out=[];
  for(let row=0;row+h<=R-1;row++)for(let col=0;col+w<=C;col++)if(canPut(m,row,col))out.push([row,col]);
  return out;
}
/* cuánto se corre el centro de masa de la torre respecto al centro */
function offset(extra){
  let n=0,sx=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const v=G2[r][c];if(v&&v!=='B'){n++;sx+=c+.5}}
  (extra||[]).forEach(x=>{n++;sx+=x});
  return n?sx/n-C/2:0;
}
function anyMove(ps){
  return ps.some(p=>rots(p).some(o=>{
    const h=o.m.length,w=o.m[0].length;
    for(let row=0;row+h<=R-1;row++)for(let col=0;col+w<=C;col++)if(canPut(o.m,row,col))return true;
    return false;
  }));
}
/* centro de masa si se agrega la pieza m en la columna col (n y sx son los totales actuales de la torre) */
function sums(){
  let n=0,sx=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const v=G2[r][c];if(v&&v!=='B'){n++;sx+=c+.5}}
  return[n,sx];
}
function offWith(m,col,n,sx){
  let k=0,s=0;
  m.forEach(row=>row.forEach((v,c)=>{if(v){k++;s+=col+c+.5}}));
  return (sx+s)/(n+k)-C/2;
}

/* ---------- partida ---------- */
// mismo "seed" = mismas piezas para los dos jugadores en línea
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const genTray=k=>{const r=rng(seed*7919+k*104729+1);return[newP(r),newP(r),newP(r)]};
const canPlay=()=>!over&&!ghost&&!thinking&&turn===meIdx;

function leave(){                                   // salir de la partida (avisa al amigo si seguía en juego)
  if(unwatch){unwatch();unwatch=null}
  if(online&&!over&&window.FB)FB.leaveGame(online.id);
  online=null;ghost=null;thinking=false;gid++;
}
function start(m,g){
  closeEnd();leave();oppGone=false;
  mode=m;turn=0;placed=0;mv=0;over=false;falling=0;ang=0;av=0;tgt=0;drag=null;pieces=[];bodies=[];gid++;thud=false;rv=0;
  ghost=null;thinking=false;queue=[];seen=0;
  if(m===2){online=g;seed=g.seed;meIdx=g.me;names=g.names.slice()}
  else{online=null;seed=(Math.random()*2147483646|0)+1;meIdx=0;names=[window.myName||'Tú','IA 🤖']}
  G2=[...Array(R)].map(()=>Array(C).fill(0));
  for(let c=BL;c<=BR;c++)G2[R-1][c]='B';
  go('tw');fit();newTray();
  if(m===2)unwatch=FB.watchGame(g.id,onGame);
  if(!raf)raf=requestAnimationFrame(loop);
  beep(600,.1);
}
function updateInfo(){
  $('twInfo').textContent=over?'Fin de la partida':thinking?'IA pensando…':(turn===meIdx?'Tu turno':'Turno: '+names[turn]);
}
function newTray(){
  tray=genTray(mv);
  updateInfo();drawTray();
  if(!anyMove(tray)){                         // ya no cabe nada y la torre sigue en pie: empate (no se cae)
    end('¡Empate!','Ya no caben más piezas y la torre sigue en pie.',-1);
    return;
  }
  if(mode===1&&turn===1)aiPlay();
}
function nextTurn(){turn^=1;mv++;newTray()}
function place(i,rot,col,row,remote){
  const p=tray[i],m=rotN(p.b,rot);
  if(!canPut(m,row,col)){if(!remote){beep(180,.15,'triangle',.1);vib(25)}return}
  p.m=m;p.rot=rot&3;
  if(mode===2&&!remote){FB.sendMove(online.id,{k:mv,u:online.myUid,i:i,r:p.rot,c:col,y:row});seen=mv+1}
  cellsOf(p.m).forEach(([dr,dc])=>{G2[row+dr][col+dc]=p.c});
  pieces.push({c:p.c,cells:cellsOf(p.m).map(([dr,dc])=>[row+dr,col+dc])});
  placed++;
  const off=offset();
  tgt=off*DEG*Math.PI/180;
  beep(420,.08,'sine',.15);beep(630,.08,'sine',.1,.04);vib(12);
  const bad=unstable(pieces);                       // ¿alguna pieza (o grupo) no se sostiene por gravedad?
  if(bad||Math.abs(off)>LIM){
    const loser=turn,dir=bad&&bad.dir?bad.dir:(off>0?1:-1);
    return fall(dir,'¡Se cayó la torre!',
      loser===meIdx?(bad?'Tu pieza no se sostuvo. ':'La tiraste tú. ')+'¡Gana '+names[1-meIdx]+'!'
                   :names[loser]+(bad?' no logró sostener su pieza. ':' la tiró. ')+'¡Ganaste!',1-loser);
  }
  if(Math.abs(off)>LIM*.7)beep(140,.25,'sawtooth',.06,.1);
  nextTurn();
}
/* muestra la pieza "fantasma" un momento antes de soltarla (jugadas de la IA o del amigo) */
function playGhost(p,col,row,fn){
  const g=gid;ghost={m:p.m,c:p.c,col:col,r:row};
  beep(500,.05,'sine',.08);updateInfo();
  setTimeout(()=>{if(g!==gid||over)return;ghost=null;fn()},700);
}

/* ---------- amigo en línea ---------- */
function onGame(d){
  if(!online)return;
  if(d.left&&d.left!==online.myUid){
    oppGone=true;
    if(over){if(rm&&!rm.gone){rm.gone=true;rmPaint()}return}
    end('Tu amigo se fue',names[1-meIdx]+' salió de la partida. ¡Ganaste!',meIdx);return;
  }
  if(over)return;
  const ms=d.moves||[];
  while(seen<ms.length)queue.push(ms[seen++]);
  drain();
}
function drain(){
  if(ghost||over||!queue.length||!online)return;
  const m=queue.shift();
  if(m.k!==mv||m.u===online.myUid)return drain();
  const p=tray[m.i];if(!p)return drain();
  const rot=m.r|0,mm=rotN(p.b,rot);
  if(typeof m.y!=='number'||!canPut(mm,m.y,m.c))return drain();
  p.m=mm;p.rot=rot&3;
  playGhost(p,m.c,m.y,()=>{place(m.i,rot,m.c,m.y,true);drain()});
}

/* ---------- la IA ---------- */
function withPiece(c,fn){                           // pone la pieza un momento en la torre para probar qué pasaría
  const cs=cellsOf(c.m);
  cs.forEach(([dr,dc])=>{G2[c.row+dr][c.col+dc]='x'});
  const v=fn();
  cs.forEach(([dr,dc])=>{G2[c.row+dr][c.col+dc]=0});
  return v;
}
function hasSafe(ps){                               // ¿hay alguna jugada que no tire la torre? (revisión rápida)
  const [n,sx]=sums();
  return ps.some(p=>rots(p).some(o=>spots(o.m).some(([row,col])=>Math.abs(offWith(o.m,col,n,sx))<=LIM&&localOk(o.m,row,col))));
}
function aiChoose(){
  const cands=[],[n,sx]=sums();
  tray.forEach((p,i)=>rots(p).forEach(o=>spots(o.m).forEach(([row,col])=>{
    cands.push({i:i,m:o.m,rot:o.rot,col:col,row:row,off:offWith(o.m,col,n,sx)});
  })));
  const safe=cands.filter(c=>Math.abs(c.off)<=LIM&&localOk(c.m,c.row,c.col)&&!unstable(pieces.concat([{cells:cellsAt(c.m,c.row,c.col)}])));
  if(!safe.length){cands.sort((a,b)=>Math.abs(a.off)-Math.abs(b.off));return cands[0]}   // no hay escapatoria
  if(Math.random()<.15)return safe[Math.random()*safe.length|0];                         // a veces se equivoca
  // hay muchos huecos posibles, así que solo estudia algunas jugadas seguras al azar
  const pool=safe.slice().sort(()=>Math.random()-.5).slice(0,30);
  pool.forEach(c=>{
    // prueba piezas al azar: ¿a cuántas el rival ya no les encuentra una jugada segura?
    let stuck=0;const K=8;
    withPiece(c,()=>{for(let k=0;k<K;k++){const t=[newP(),newP(),newP()];if(anyMove(t)&&!hasSafe(t))stuck++}});
    c.score=stuck/K*10-Math.abs(c.off)*.1+Math.random()*.6;
  });
  pool.sort((a,b)=>b.score-a.score);
  return pool[0];
}
function aiPlay(){
  const g=gid;thinking=true;updateInfo();
  setTimeout(()=>{
    if(g!==gid||over)return;
    const c=aiChoose();
    thinking=false;
    const p=tray[c.i];p.m=c.m;p.rot=c.rot;
    playGhost(p,c.col,c.row,()=>place(c.i,c.rot,c.col,c.row,true));
  },600+Math.random()*600);
}
function fall(dir,t,m,w){
  falling=dir;av=0;over=true;thud=false;
  const g=gid;
  // cada pieza se vuelve un cuerpo con masa, inercia y gravedad, justo donde estaba en la torre inclinada
  const ca=Math.cos(ang),sa=Math.sin(ang),tx=OX+RR*ang;
  bodies=pieces.map(pc=>{
    const pts=pc.cells.map(([r,c])=>[cx(c)+S/2,cy(r)+S/2]);
    const mx=pts.reduce((t,q)=>t+q[0],0)/pts.length,my=pts.reduce((t,q)=>t+q[1],0)/pts.length;
    const loc=pts.map(q=>[q[0]-mx,q[1]-my]);
    return{
      c:pc.c,hit:false,loc:loc,m:loc.length,
      I:loc.reduce((t,q)=>t+q[0]*q[0]+q[1]*q[1],0)+loc.length*S*S/6,
      rad:Math.max(...loc.map(q=>Math.hypot(q[0],q[1])))+S/2,
      x:tx+mx*ca-my*sa,y:OY+mx*sa+my*ca,rot:ang,
      vx:dir*Math.random()*.4,vy:-Math.random()*.4,w:dir*Math.random()*.01
    };
  });
  [300,240,180,120].forEach((f,k)=>beep(f,.25,'sawtooth',.1,k*.12));
  vib([60,40,100]);
  setTimeout(()=>{
    if(g!==gid||!$('tw').classList.contains('on'))return;
    end(t,m,w);
  },3200);
}
const cellsW=b=>{const c=Math.cos(b.rot),s=Math.sin(b.rot);return b.loc.map(q=>[b.x+q[0]*c-q[1]*s,b.y+q[0]*s+q[1]*c])};
function applyJ(a,b,jx,jy,rax,ray,rbx,rby){
  a.vx+=jx/a.m;a.vy+=jy/a.m;a.w+=(rax*jy-ray*jx)/a.I;
  if(b){b.vx-=jx/b.m;b.vy-=jy/b.m;b.w-=(rbx*jy-rby*jx)/b.I}
}
/* choque entre un cuerpo (a) y otro (b) o una superficie fija (b=null). n apunta hacia a */
function hit(a,b,px,py,nx,ny,depth,vsx,vsy){
  const imA=1/a.m,iiA=1/a.I,imB=b?1/b.m:0,iiB=b?1/b.I:0,tot=imA+imB;
  const corr=Math.max(depth-.2,0)*.5;                 // los saca del otro para que no se atraviesen
  a.x+=nx*corr*imA/tot;a.y+=ny*corr*imA/tot;
  if(b){b.x-=nx*corr*imB/tot;b.y-=ny*corr*imB/tot}
  const rax=px-a.x,ray=py-a.y,rbx=b?px-b.x:0,rby=b?py-b.y:0;
  const rel=()=>[
    a.vx-a.w*ray-(b?b.vx-b.w*rby:vsx),
    a.vy+a.w*rax-(b?b.vy+b.w*rbx:vsy)
  ];
  let r=rel();
  const vn=r[0]*nx+r[1]*ny;
  if(vn>=0)return;
  const ran=rax*ny-ray*nx,rbn=b?rbx*ny-rby*nx:0;
  const k=tot+ran*ran*iiA+rbn*rbn*iiB;
  const j=-(1+(vn<-3?.25:0))*vn/k;                   // rebote suave si pega fuerte
  applyJ(a,b,nx*j,ny*j,rax,ray,rbx,rby);
  r=rel();                                            // fricción: así se frenan y no patinan para siempre
  const fx=-ny,fy=nx,vt=r[0]*fx+r[1]*fy;
  const rat=rax*fy-ray*fx,rbt=b?rbx*fy-rby*fx:0;
  const kt=tot+rat*rat*iiA+rbt*rbt*iiB;
  const lim=.55*j;
  const jt=Math.max(-lim,Math.min(lim,-vt/kt));
  applyJ(a,b,fx*jt,fy*jt,rax,ray,rbx,rby);
}
/* gravedad: las piezas caen, chocan con la mesa, con el balancín y entre ellas */
function stepBodies(){
  const SUB=4,dt=1/SUB,gr=.5,r=S/2,floor=OY+RR;
  const rc=Math.cos(ang),rs=Math.sin(ang),bx=OX+RR*ang,TOP=YB-S;
  if(sndCool>0)sndCool--;
  for(let st=0;st<SUB;st++){
    bodies.forEach(b=>{b.vy+=gr*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.w*dt;b.vx*=.9995;b.w*=.998});
    for(let it=0;it<4;it++){
      const W=bodies.map(cellsW);
      bodies.forEach((b,i)=>{
        W[i].forEach(([x,y])=>{
          if(y+r>floor){                                           // mesa
            if(b.vy>3&&!b.hit&&sndCool<=0){b.hit=true;sndCool=6;beep(110+Math.random()*120,.08,'square',.05)}
            hit(b,null,x,floor,0,-1,y+r-floor,0,0);
          }
          if(x-r<0)hit(b,null,0,y,1,0,r-x,0,0);                    // paredes
          else if(x+r>CW)hit(b,null,CW,y,-1,0,x+r-CW,0,0);
          const dx=x-bx,dy=y-OY,lx=dx*rc+dy*rs,ly=-dx*rs+dy*rc;     // balancín (en sus coordenadas)
          let nlx=0,nly=0,dep=0;
          if(ly>=YB){
            const d=Math.hypot(lx,ly);
            if(d<RR+r&&d>1e-6){nlx=lx/d;nly=ly/d;dep=RR+r-d}
          }else{
            const qx=Math.max(-BH,Math.min(BH,lx)),qy=Math.max(TOP,Math.min(YB,ly));
            const ex=lx-qx,ey=ly-qy,d=Math.hypot(ex,ey);
            if(d>1e-6){if(d<r){nlx=ex/d;nly=ey/d;dep=r-d}}
            else{nlx=0;nly=-1;dep=ly-TOP+r}
          }
          if(dep>0){
            const nx=nlx*rc-nly*rs,ny=nlx*rs+nly*rc,px=x-nx*r,py=y-ny*r;
            hit(b,null,px,py,nx,ny,dep,RR*rv-rv*(py-OY),rv*(px-bx));
          }
        });
      });
      for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){   // piezas contra piezas
        const a=bodies[i],c=bodies[j];
        if(Math.hypot(a.x-c.x,a.y-c.y)>a.rad+c.rad)continue;
        for(const [x1,y1] of W[i])for(const [x2,y2] of W[j]){
          const dx=x1-x2,dy=y1-y2,d2=dx*dx+dy*dy;
          if(d2>=S*S||d2<1e-6)continue;
          const d=Math.sqrt(d2);
          hit(a,c,(x1+x2)/2,(y1+y2)/2,dx/d,dy/d,S-d,0,0);
        }
      }
    }
  }
}
/* cuadro final en línea: "Volver a jugar" con la misma persona */

/* ---------- bandeja de piezas ---------- */
function drawTray(){
  const t=$('twT');t.innerHTML='';
  if(turn!==meIdx){                              // no es tu turno: solo ves la torre y este aviso
    const w=document.createElement('span');w.className='wait';

    g.style.gridTemplateColumns='repeat('+w+','+sz+'px)';

    }));
    s.appendChild(g);
    s.addEventListener('pointerdown',e=>down(e,i));

/* ---------- arrastrar / girar ---------- */
const scaleNow=()=>cv.getBoundingClientRect().width/CW;
const liftOf=d=>d.touch?S*scaleNow()*1.6:0;          // con el dedo la pieza se ve un poco más arriba
/* punto de la pantalla -> casilla (con decimales) en la torre, contando la inclinación del balancín */
function boardPt(x,y){
  const rect=cv.getBoundingClientRect(),k=rect.width/CW;
  const px=(x-rect.left)/k-(OX+RR*ang),py=(y-rect.top)/k-OY;
  const c=Math.cos(ang),s=Math.sin(ang);
  const lx=px*c+py*s,ly=-px*s+py*c;
  return[(lx+C*S/2)/S,(ly-YB)/S+R];
}
/* la mejor forma de poner la pieza cerca del punto (x,y): prueba todas las rotaciones y huecos cercanos
   y se queda con la que más se pega a la torre (encaja mejor) sin alejarse mucho del dedo */
function findSpot(p,x,y){
  const [fc,fr]=boardPt(x,y),cur=JSON.stringify(p.m);
  let best=null;
  rots(p).forEach(o=>{
    const w=o.m[0].length,h=o.m.length,c0=Math.round(fc-w/2),r0=Math.round(fr-h/2),same=JSON.stringify(o.m)===cur;
    for(let row=r0-2;row<=r0+2;row++)for(let col=c0-2;col<=c0+2;col++){
      if(!canPut(o.m,row,col))continue;
      const d=Math.hypot(col+w/2-fc,row+h/2-fr);
      if(d>2.4)continue;
      const bad=!!unstable(pieces.concat([{cells:cellsAt(o.m,row,col)}]));   // ¿se caería por gravedad?
      const sc=contacts(o.m,row,col)-d*1.5+(same?.4:0)-(bad?6:0);
      if(!best||sc>best.sc)best={sc:sc,rot:o.rot,m:o.m,row:row,col:col,bad:bad};
    }
  });
  return best;
}
function down(e,i){
  if(!canPlay())return;
  e.preventDefault();
  drag={i:i,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType!=='mouse',pl:null,fk:'',fm:null,warn:false};
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',stopDrag);
}
function buildFloat(d,m){                      // dibuja la pieza que flota bajo el dedo con la forma indicada
  const px=S*scaleNow()-2,el=$('twDrag');
  el.innerHTML='';el.style.display='grid';
  el.style.gridTemplateColumns='repeat('+m[0].length+','+px+'px)';
  const col=tray[d.i].c;
  m.forEach(row=>row.forEach(v=>{
    const c=document.createElement('div');c.style.height=px+'px';
    if(v){c.style.background=col;c.className='on'}
    el.appendChild(c);
  }));
  d.fm=m;d.fk=JSON.stringify(m);
}
function startFloat(){
  trayTop=$('twT').getBoundingClientRect().top;
  $('twDrag').style.opacity=.85;
  buildFloat(drag,tray[drag.i].m);
  beep(500,.05,'sine',.08);vib(8);
}
function moveFloat(){
  const px=S*scaleNow(),el=$('twDrag'),m=drag.fm;
  const w=m[0].length*px,h=m.length*px,lift=liftOf(drag);
  el.style.left=(drag.x-w/2)+'px';
  el.style.top=(drag.y-h/2-lift)+'px';
}
/* busca dónde encaja la pieza y, si cambia de forma, la gira también bajo el dedo */
function refreshSpot(d){
  const p=tray[d.i];
  d.pl=d.y<trayTop-6?findSpot(p,d.x,d.y-liftOf(d)):null;
  const m=d.pl?d.pl.m:p.m;
  if(JSON.stringify(m)!==d.fk)buildFloat(d,m);
  $('twDrag').style.opacity=d.pl?.3:.85;      // si ya encontró hueco, la sombra de la torre es la que manda
  const w=!!(d.pl&&d.pl.bad);
  if(w!==d.warn){d.warn=w;if(w)$('twInfo').textContent='⚠ ¡Se va a caer!';else updateInfo()}
}
function move(e){
  if(!drag)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.on&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>10){drag.on=true;startFloat()}
  if(drag.on){refreshSpot(drag);moveFloat()}
}
function stopDrag(){
  window.removeEventListener('pointermove',move);
  window.removeEventListener('pointerup',up);
  window.removeEventListener('pointercancel',stopDrag);
  $('twDrag').style.display='none';
  if(drag&&drag.warn)updateInfo();
  drag=null;
}
function up(e){
  const d=drag;
  if(d&&d.on){d.x=e.clientX;d.y=e.clientY;refreshSpot(d)}
  stopDrag();
  if(!d||over)return;
  if(!d.on){                                   // un toque: gira la pieza
    tray[d.i].m=rotM(tray[d.i].m);tray[d.i].rot=((tray[d.i].rot||0)+1)%4;
    beep(520,.05,'sine',.08);vib(6);drawTray();
    return;
  }
  if(e.clientY<trayTop-6){                     // soltó sobre la torre
    if(d.pl)place(d.i,d.pl.rot,d.pl.col,d.pl.row);
    else{beep(180,.15,'triangle',.1);vib(25)}
  }
}

/* ---------- dibujo ---------- */
function cell(x,y,col,a){
  ctx.globalAlpha=a;
  ctx.fillStyle=col;ctx.fillRect(x+1,y+1,S-2,S-2);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(x+6,y+6,S-12,S-12);      // hueco como las fichas del juguete
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(x+1,y+1,S-2,3);
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,OY+RR,CW,4);            // mesa
  ctx.save();
  ctx.translate(OX+RR*ang,OY);ctx.rotate(ang);                         // el balancín rueda al inclinarse
  const A=Math.atan2(YB,BH);
  ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.arc(0,0,RR,A,Math.PI-A);ctx.closePath();ctx.fill();
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const v=G2[r][c];if(!v)continue;
    if(v==='B'){ctx.fillStyle='#2b2b2b';ctx.fillRect(cx(c),cy(r),S,S);ctx.fillStyle='#444';ctx.fillRect(cx(c),cy(r),S,3)}
    else if(!falling)cell(cx(c),cy(r),v,1);
  }
  let pred=null;
  if(drag&&drag.on&&!over&&drag.y<trayTop-6){                          // sombra de dónde va a quedar (ya girada)
    const p=tray[drag.i];
    if(drag.pl){
      const q=drag.pl;
      cellsOf(q.m).forEach(([dr,dc])=>{
        cell(cx(q.col+dc),cy(q.row+dr),p.c,.65);
        if(q.bad){ctx.strokeStyle='#ff1744';ctx.lineWidth=2;ctx.strokeRect(cx(q.col+dc)+1,cy(q.row+dr)+1,S-2,S-2)}
      });
      pred=offset(cellsOf(q.m).map(([dr,dc])=>q.col+dc+.5));
    }else{                                                             // no cabe por aquí: sombra roja
      const [fc,fr]=boardPt(drag.x,drag.y-liftOf(drag)),w=p.m[0].length,h=p.m.length;
      const col=Math.max(0,Math.min(C-w,Math.round(fc-w/2))),row=Math.max(0,Math.min(R-1-h,Math.round(fr-h/2)));
      cellsOf(p.m).forEach(([dr,dc])=>cell(cx(col+dc),cy(row+dr),'#c62828',.35));
    }
  }
  if(ghost)cellsOf(ghost.m).forEach(([dr,dc])=>cell(cx(ghost.col+dc),cy(ghost.r+dr),ghost.c,.55));
  ctx.restore();
  bodies.forEach(b=>{
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
    b.loc.forEach(([lx,ly])=>cell(lx-S/2,ly-S/2,b.c,1));
    ctx.restore();
  });
  const ratio=Math.max(-1,Math.min(1,ang/LIMA));
  $('twM').style.left=(50+ratio*50)+'%';
  const pe=$('twP');
  if(pred===null)pe.style.display='none';
  else{pe.style.display='block';pe.style.left=(50+Math.max(-1,Math.min(1,pred/LIM))*50)+'%'}
}
function loop(){
  if(!$('tw').classList.contains('on')){raf=0;return}
  if(falling){
    const lim=.78,old=ang;                           // hasta que la esquina de la base toca la mesa
    av+=.003;ang+=falling*av;                        // la gravedad la jala cada vez más fuerte
    if(falling*ang>=lim){ang=falling*lim;av=0;if(!thud){thud=true;beep(90,.25,'square',.1);vib(40)}}
    rv=ang-old;
    stepBodies();
  }
  else{av+=(tgt-ang)*.09;av*=.8;ang+=av}
  try{draw()}catch(e){console.error(e)}
  raf=requestAnimationFrame(loop);
}
function fit(){
  const aw=Math.min(innerWidth*.96,440),ah=innerHeight-260;
  const sc=Math.max(.3,Math.min(aw/CW,ah/CH));
  cv.style.width=Math.round(CW*sc)+'px';cv.style.height=Math.round(CH*sc)+'px';
}
window.addEventListener('resize',fit);

$('tw1').onclick=()=>start(1);
$('tw2').onclick=()=>{
  if(!window.FB||!FB.openInvite){window.openLogin('login');lmsg('Firebase no cargó, revisa tu internet');return}
  FB.openInvite();                                  // elegir a qué amigo invitar
};
$('twBack').onclick=()=>{leave();menu()};
window.TW={
  startOnline:g=>start(2,g),

  offer:f=>{if(rm&&!rm.gone){rm.offer=!!f;rmPaint()}}  // el amigo pidió (o ya no) volver a jugar

  $('tabF').classList.toggle('on',t==='F');
}
// recorta la foto a cuadrado de 128x128 para que pese muy poco
function resizeImg(file,px){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=px;c.height=px;
      const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
      c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,px,px);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

  }catch(e){pmsg(errs[e.code]||'No se pudo guardar')}
}

/* ---------- amigos ---------- */
function row(u,fallback,sub,btns){
  const nm=u.name||fallback;
  const d=document.createElement('div');d.className='item';
  d.appendChild(window.mkAv({...u,name:nm},40));
  const inf=document.createElement('div');inf.className='inf';
  const b=document.createElement('b');b.textContent=nm;
  const sm=document.createElement('small');sm.textContent=sub;
  inf.append(b,sm);d.appendChild(inf);
  btns.forEach(x=>d.appendChild(x));
  return d;
}
function fill(el,title,items,empty){
  el.innerHTML='';
  if(!items.length&&!empty)return;
  const h=document.createElement('h3');h.textContent=title;el.appendChild(h);
  if(!items.length){const p=document.createElement('p');p.className='msg';p.textContent=empty;el.appendChild(p)}
  items.forEach(i=>el.appendChild(i));
}
async function renderFriends(){
  if(!me||!$('pf').classList.contains('on'))return;
  const tok=++rtok,my=me.uid;
  const rec=reqTo.filter(r=>r.status==='pending');
  const sent=reqFrom.filter(r=>r.status==='pending');
  const fr=[...reqFrom,...reqTo].filter(r=>r.status==='accepted');
  const other=r=>r.from===my?r.to:r.from;
  const nameOf=r=>r.from===my?r.toName:r.fromName;
  const users={};
  await Promise.all([...new Set([...rec,...sent,...fr].map(other))].map(async id=>{users[id]=await getUser(id)}));
  if(tok!==rtok||!me)return;

  fill($('fReq'),'Solicitudes recibidas',rec.map(r=>row(users[other(r)],nameOf(r),'Quiere ser tu amigo',[
    btn('Aceptar','g',()=>updateDoc(doc(db,'requests',r.id),{status:'accepted'}).catch(e=>fmsg('Error: '+e.code))),
    btn('X','r',()=>deleteDoc(doc(db,'requests',r.id)).catch(e=>fmsg('Error: '+e.code)))
  ])));
  fill($('fSent'),'Solicitudes enviadas',sent.map(r=>row(users[other(r)],nameOf(r),'Pendiente...',[
    btn('Cancelar','r',()=>deleteDoc(doc(db,'requests',r.id)).catch(e=>fmsg('Error: '+e.code)))
  ])));
  fill($('fList'),'Mis amigos',fr.map(r=>{
    const u=users[other(r)];
    const sub=(u.status?u.status+' · ':'')+'Récord: '+(u.best||0);
    return row(u,nameOf(r),sub,[
      btn('Quitar','r',()=>{if(confirm('¿Quitar a '+(u.name||nameOf(r))+' de tus amigos?'))deleteDoc(doc(db,'requests',r.id)).catch(e=>fmsg('Error: '+e.code))})
    ]);
  }),'Todavía no tienes amigos');
}
async function addFriend(){
  if(!me)return;
  const name=$('fIn').value.trim();
  if(!name)return;
  if(name.toLowerCase()===me.name.toLowerCase())return fmsg('Ese eres tú 😅');
  try{
    const d=await getDoc(doc(db,'usernames',name.toLowerCase()));
    if(!d.exists())return fmsg('Ese usuario no existe');
    const uid=d.data().uid;
    const ex=[...reqFrom,...reqTo].find(r=>r.from===uid||r.to===uid);
    if(ex){
      if(ex.status==='accepted')return fmsg('Ya son amigos');
      if(ex.from===uid){await updateDoc(doc(db,'requests',ex.id),{status:'accepted'});$('fIn').value='';return fmsg('¡Ya son amigos!')}
      return fmsg('Ya le mandaste una solicitud');
    }
    const ud=await getUser(uid);
    await setDoc(doc(db,'requests',me.uid+'_'+uid),{
      from:me.uid,to:uid,fromName:me.name,toName:ud.name||name,status:'pending',createdAt:serverTimestamp()
    });
    $('fIn').value='';fmsg('Solicitud enviada ✔');
  }catch(e){fmsg(errs[e.code]||('Error: '+(e.code||e.message)))}
}
$('fAdd').onclick=addFriend;
$('fIn').onkeydown=e=>{if(e.key==='Enter')addFriend()};


/* ---------- invitar a un amigo a Torre Tetris (2 jugadores en línea) ---------- */
const imsg=t=>{$('invMsg').textContent=t};
function stopWait(){if(waitUnsub){waitUnsub();waitUnsub=null}clearTimeout(waitTimer)}
function closeInv(){stopWait();waitId='';$('inv').classList.remove('on')}
const cancelInvite=id=>{
  const ref=doc(db,'games',id);
  return runTransaction(db,async tx=>{const s=await tx.get(ref);if(s.exists()&&s.data().status==='invited')tx.delete(ref)}).catch(()=>{});
};
async function myFriends(){
  if(!me)return [];
  const my=me.uid,out=[];
  await Promise.all([...reqFrom,...reqTo].filter(r=>r.status==='accepted').map(async r=>{
    const id=r.from===my?r.to:r.from,u=await getUser(id);
    out.push({uid:id,name:u.name||(r.from===my?r.toName:r.fromName),user:u});
  }));
  return out;
}
async function showInvList(){
  stopWait();waitId='';
  $('invT').textContent='Invitar amigo';imsg('');$('invX').textContent='Cancelar';
  const L=$('invList');L.innerHTML='<p class="msg">Cargando...</p>';
  $('inv').classList.add('on');
  const fr=await myFriends();
  L.innerHTML='';
  if(!fr.length){L.innerHTML='<p class="msg">Todavía no tienes amigos. Agrégalos en "Perfil y amigos".</p>';return}
  fr.forEach(f=>L.appendChild(row({...f.user,name:f.name},f.name,f.user.status||('Récord: '+(f.user.best||0)),[
    btn('Invitar','g',()=>sendInvite(f))
  ])));
}
async function sendInvite(f){
  if(!me)return;
  const id=me.uid+'_'+Date.now();
  try{
    await setDoc(doc(db,'games',id),{
      from:me.uid,to:f.uid,fromName:me.name,toName:f.name,
      seed:(Math.random()*2147483646|0)+1,status:'invited',moves:[],left:'',createdAt:serverTimestamp()
    });
  }catch(e){return imsg(errs[e.code]||('No se pudo invitar: '+(e.code||e.message)))}
  waitId=id;
  $('invT').textContent='Esperando...';$('invX').textContent='Cancelar invitación';imsg('');
  const L=$('invList');L.innerHTML='';
  const p=document.createElement('p');p.className='msg';p.textContent='Esperando a que '+f.name+' acepte la invitación';L.appendChild(p);
  waitUnsub=onSnapshot(doc(db,'games',id),s=>{
    const d=s.data();if(!d||waitId!==id)return;
    if(d.status==='playing'){closeInv();beginGame(id,d,0)}
    else if(d.status==='declined'){deleteDoc(doc(db,'games',id)).catch(()=>{});showInvList().then(()=>imsg(f.name+' rechazó la invitación'))}
  },()=>{});
  waitTimer=setTimeout(()=>{cancelInvite(id);showInvList().then(()=>imsg(f.name+' no respondió'))},90000);
}
$('invX').onclick=()=>{if(waitId)cancelInvite(waitId);closeInv()};
function beginGame(id,d,idx){
  if(!window.TW||!me)return;
  window.TW.startOnline({
    id:id,seed:d.seed,me:idx,myUid:me.uid,names:[d.fromName,d.toName],
    opp:{uid:idx?d.from:d.to,name:idx?d.fromName:d.toName}
  });
}
// invitaciones que me llegan
const stale=g=>g.createdAt&&g.createdAt.toMillis&&Date.now()-g.createdAt.toMillis()>120000;
async function acceptInvite(g){                     // acepta una invitación y empieza la partida
  doneInv.add(g.id);
  try{
    const ref=doc(db,'games',g.id);
    await runTransaction(db,async tx=>{
      const s=await tx.get(ref);
      if(!s.exists()||s.data().status!=='invited')throw new Error('gone');
      tx.update(ref,{status:'playing'});
    });
  }catch(e){return false}
  closeInv();
  beginGame(g.id,{...g,status:'playing'},1);
  return true;
}
function checkInv(){
  let fresh=incoming.filter(g=>g.status==='invited'&&!doneInv.has(g.id)&&!stale(g));
  // si estoy en el cuadro final de una partida, la invitación de ese mismo amigo es "volver a jugar"
  const ro=window.TW&&window.TW.rematchOpp?window.TW.rematchOpp():'';
  if(ro){
    const o=fresh.find(g=>g.from===ro);
    window.TW.offer(!!o);
    if(o&&waitId&&me&&me.uid<ro){                   // los dos pidieron a la vez: el de uid menor acepta la del otro
      const mine=waitId;stopWait();waitId='';cancelInvite(mine);acceptInvite(o);
    }
    fresh=fresh.filter(g=>g.from!==ro);
  }
  const cur=fresh.find(g=>g.id===shownInv)||fresh[0];
  if(!cur){shownInv='';$('got').classList.remove('on');return}
  shownInv=cur.id;
  $('gotM').textContent=cur.fromName+' te invita a jugar Torre Tetris';
  $('got').classList.add('on');
}
$('gotY').onclick=async()=>{
  const id=shownInv,g=incoming.find(x=>x.id===id);
  if(!g)return;
  doneInv.add(id);$('got').classList.remove('on');
  try{
    const ref=doc(db,'games',id);
    await runTransaction(db,async tx=>{
      const s=await tx.get(ref);
      if(!s.exists()||s.data().status!=='invited')throw new Error('gone');
      tx.update(ref,{status:'playing'});
    });
  }catch(e){return alert('Esa invitación ya no está disponible')}
  closeInv();
  beginGame(id,{...g,status:'playing'},1);
};
$('gotN').onclick=()=>{
  const id=shownInv;doneInv.add(id);$('got').classList.remove('on');
  updateDoc(doc(db,'games',id),{status:'declined'}).catch(()=>{});
};

/* ---------- funciones que usa el resto de la pagina ---------- */
window.FB={
  async login(id,pass){
    if(!id||!pass)return msg('Escribe tu usuario o correo y la contraseña');
    try{
      let mail=id;
      if(!id.includes('@')){
        const d=await getDoc(doc(db,'usernames',id.toLowerCase()));
        if(!d.exists())return msg('Ese usuario no existe (si es una cuenta vieja, entra con tu correo)');
        mail=d.data().mail;
      }
      await signInWithEmailAndPassword(auth,mail,pass);
    }catch(e){fail(e)}
  },
  async register(name,mail,pass){
    const bad=nameProblem(name);
    if(bad)return msg(bad);
    if(!mail||!pass)return msg('Llena todos los campos');
    registering=true;
    try{
      const cred=await createUserWithEmailAndPassword(auth,mail,pass);
      try{await saveName(cred.user,name)}
      catch(e){
        await cred.user.delete();
        return e.message==='taken'?msg('Ese usuario ya existe'):fail(e);
      }
      await refresh(cred.user,false);
    }catch(e){fail(e)}
    finally{registering=false}
  },
  async claim(name){
    const u=auth.currentUser;
    if(!u)return msg('Primero inicia sesión');
    const bad=nameProblem(name);
    if(bad)return msg(bad);
    try{await saveName(u,name);await refresh(u,false)}
    catch(e){e.message==='taken'?msg('Ese usuario ya existe'):fail(e)}
  },
  openProfile(){
    if(!me)return;
    window.go('pf');showTab('P');fillProfile();fmsg('');renderFriends();
  },
  // guarda el récord en la cuenta (espera 3 segundos para no escribir en cada jugada)
  saveBest(n){
    if(!me||!(n>(me.best||0)))return;
    const uid=me.uid;clearTimeout(bt);
    bt=setTimeout(async()=>{
      try{await updateDoc(doc(db,'users',uid),{best:n});if(me&&me.uid===uid)me.best=n}catch(e){}
    },3000);
  },
  logout(){signOut(auth)},
  // ----- Torre Tetris en línea -----
  openInvite(){
    if(!me){
      if(auth.currentUser){window.openLogin('claim');msg('Elige tu usuario para poder jugar con amigos')}
      else{window.openLogin('login');msg('Inicia sesión para invitar a un amigo')}
      return;
    }
    showInvList();
  },
  invite(f){if(!me)return;$('inv').classList.add('on');sendInvite(f)},
  watchGame(id,cb){return onSnapshot(doc(db,'games',id),s=>{if(s.exists())cb(s.data())},()=>{})},
  sendMove(id,m){
    updateDoc(doc(db,'games',id),{moves:arrayUnion(m)})
      .catch(e=>alert('No se pudo enviar tu jugada: '+(errs[e.code]||e.code||e.message)));
  },
  endGame(id,ms){setTimeout(()=>deleteDoc(doc(db,'games',id)).catch(()=>{}),ms||6000)},
  recheckInv(){checkInv()},
  cancelRematch(){if(waitId)cancelInvite(waitId);stopWait();waitId=''},
  // "Volver a jugar" con la misma persona: si ya me lo pidió lo acepto; si no, le mando la invitación
  async rematch(opp,cb){
    if(!me)return cb('error','Inicia sesión para jugar con tu amigo');
    stopWait();waitId='';
    const g=incoming.find(x=>x.status==='invited'&&x.from===opp.uid&&!doneInv.has(x.id)&&!stale(x));
    if(g){if(!await acceptInvite(g))cb('error','Esa invitación ya no está disponible');return}
    const id=me.uid+'_'+Date.now();
    try{
      await setDoc(doc(db,'games',id),{
        from:me.uid,to:opp.uid,fromName:me.name,toName:opp.name,
        seed:(Math.random()*2147483646|0)+1,status:'invited',moves:[],left:'',createdAt:serverTimestamp()
      });
    }catch(e){return cb('error',errs[e.code]||('No se pudo invitar: '+(e.code||e.message)))}
    waitId=id;
    waitUnsub=onSnapshot(doc(db,'games',id),s=>{
      const d=s.data();if(!d||waitId!==id)return;
      if(d.status==='playing'){closeInv();beginGame(id,d,0)}
      else if(d.status==='declined'){deleteDoc(doc(db,'games',id)).catch(()=>{});stopWait();waitId='';cb('declined')}
    },()=>{});
    waitTimer=setTimeout(()=>{cancelInvite(id);waitId='';cb('timeout')},90000);
  },   // da tiempo a que el otro vea la última jugada
  leaveGame(id){if(me)updateDoc(doc(db,'games',id),{left:me.uid}).catch(()=>{})}
};

let first=true;
onAuthStateChanged(auth,u=>{
  const ask=!first;first=false;
  if(registering)return;
  refresh(u,ask);
});
